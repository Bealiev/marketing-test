<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тест по маркетингу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
    .tab {
      flex: 1;
      padding: 12px 8px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }
    .tab.active { border-color: var(--btn); }
    .btn.secondary { background: var(--card); color: var(--text); }
    .badge { max-width: 65%; text-align: right; line-height: 1.25; }
    #section-desc { min-height: 3em; }
  </style>
</head>
<body>
  <div id="app">

    <!-- Экран 1: старт и выбор раздела -->
    <div id="start-screen" class="screen">
      <h1>Тест по маркетингу</h1>

      <div class="tabs">
        <button class="tab active" data-section="basics">Основы маркетинга</button>
        <button class="tab" data-section="course">Курс: модули 1–8</button>
      </div>

      <p id="section-desc" class="subtitle"></p>
      <button id="btn-start" class="btn">Начать тест</button>
    </div>

    <!-- Экран 2: вопрос -->
    <div id="quiz-screen" class="screen hidden">
      <div class="top-row">
        <span id="progress">Вопрос 1 из 10</span>
        <span id="level-badge" class="badge">A</span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>

      <h2 id="question-text"></h2>

      <div id="answers"></div>

      <div id="number-box" class="hidden">
        <input id="number-input" type="text" inputmode="decimal" placeholder="Введите число">
        <button id="btn-submit" class="btn">Ответить</button>
      </div>

      <div id="feedback" class="hidden"></div>
      <button id="btn-next" class="btn hidden">Дальше</button>
    </div>

    <!-- Экран 3: результат -->
    <div id="result-screen" class="screen hidden">
      <h1>Результат</h1>
      <div id="result-section" class="subtitle"></div>
      <div id="result-score" class="big-score"></div>
      <div id="result-levels"></div>
      <button id="btn-restart" class="btn">Пройти ещё раз</button>
      <button id="btn-change" class="btn secondary">Выбрать другой раздел</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
